apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurehub-ussd
  labels: { app.kubernetes.io/name: insurehub-ussd, app.kubernetes.io/part-of: insurehub }
spec:
  replicas: 2                      # stateless: sessions live in Redis
  selector: { matchLabels: { app.kubernetes.io/name: insurehub-ussd } }
  template:
    metadata: { labels: { app.kubernetes.io/name: insurehub-ussd, app.kubernetes.io/part-of: insurehub } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1654, runAsGroup: 1654, seccompProfile: { type: RuntimeDefault } }   # "app" in the .NET image
      containers:
        - name: ussd
          image: ghcr.io/momosto/insurehub-ussd:latest
          ports: [{ name: http, containerPort: 5300 }]
          env:
            - { name: Redis__ConnectionString, value: "redis.data.svc.cluster.local:6379,defaultDatabase=3" }
            - { name: Core__Mode, value: fixtures }   # "http" once InsureHub's channel endpoints are live
            - { name: Core__LendHubUrl, value: http://lendhub-api.lendhub.svc.cluster.local }
            - { name: Core__PaymentsUrl, value: http://payments-api.integrations.svc.cluster.local }
            - { name: Core__InsureAssistUrl, value: http://insureassist-agent.insureassist.svc.cluster.local }
            - { name: Simulator__Enabled, value: "true" }   # demo only; false with a real aggregator
            - { name: Otel__Endpoint, value: http://otel-collector.observability.svc.cluster.local:4317 }
          envFrom: [{ secretRef: { name: insurehub-ussd-secrets } }]   # Ussd__CallbackSecret, Core__EventsSecret
          resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { memory: 192Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: insurehub-ussd }
spec:
  selector: { app.kubernetes.io/name: insurehub-ussd }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insurehub-ussd
  annotations: { cert-manager.io/cluster-issuer: letsencrypt }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [ussd.example.org], secretName: insurehub-ussd-tls }]
  rules:
    - host: ussd.example.org
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: insurehub-ussd, port: { name: http } } } }] }
